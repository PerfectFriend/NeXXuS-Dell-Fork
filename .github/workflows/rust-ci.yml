name: Rust CI (core/node/econ + desktop)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  rust-gates:
    name: test + clippy + audit + fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo build --release
        run: cargo build --release --workspace

      - name: e2e smoke (nexxusd поднят на scratch-сторе, порт 4010)
        run: |
          SCRATCH="$RUNNER_TEMP/e2e-node"
          mkdir -p "$SCRATCH"
          NEXXUS_EPOCH_SECS=3600 NEXXUS_POR_AUDIT_SECS=0 \
            ./target/release/nexxusd serve "$SCRATCH/store.redb" > "$SCRATCH/nexxusd.log" 2>&1 &
          echo $! > "$SCRATCH/nexxusd.pid"
          for i in $(seq 1 50); do
            python3 -c "import socket; socket.create_connection(('127.0.0.1',4010), timeout=1)" 2>/dev/null && break
            sleep 0.2
          done
          python3 scripts/e2e_smoke.py
          EC=$?
          kill "$(cat "$SCRATCH/nexxusd.pid")" 2>/dev/null
          exit $EC

      - name: cargo audit (RustSec, .cargo/audit.toml ignores)
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: wire fuzz (proptest) + golden vectors
        run: cargo test -p nexxus-core --test wire_fuzz --test wire_vectors --release

      - name: "tree hygiene gate (S1 - no redb stores, no large non-asset files)"
        run: ./scripts/check-tree-hygiene.sh

  desktop-gates:
    name: nexxus-desktop tests + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build deps for Tauri (Linux)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Frontend dist placeholder (src-tauri/gen is gitignored)
        run: |
          mkdir -p nexxus-desktop/src-tauri/gen
          cp nexxus-desktop/src/index.html nexxus-desktop/src-tauri/gen/index.html
      - name: cargo test (desktop)
        working-directory: nexxus-desktop
        # Бинарь nexxusd для интеграционных тестов — из корневого target workspace.
        env:
          CARGO_TARGET_DIR_NEXXUS: ${{ github.workspace }}/target
        run: cargo test --bin nexxus-desktop
      - name: cargo clippy (desktop)
        working-directory: nexxus-desktop
        run: cargo clippy --all-targets -- -D warnings

  wasm-gates:
    name: nexxus-wasm — сборка под wasm32 + тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: cargo test (host)
        run: cargo test -p nexxus-wasm
      - name: cargo build --target wasm32-unknown-unknown --release
        run: cargo build -p nexxus-wasm --target wasm32-unknown-unknown --release

  secret-scan:
    name: Secret scan (DoD RC1 — ни один секрет не в git/логах)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks detect (full history)
        # gitleaks-action@v2 требует лицензию; используем официальный docker-образ.
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:latest detect \
            --source /repo --config /repo/.gitleaks.toml --exit-code 1 --redact \
            --report-path /tmp/leaks.json --report-format json || { cat /tmp/leaks.json 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); [print(f['RuleID'], f['File'], f.get('Line','')) for f in d]" 2>/dev/null; exit 1; }
