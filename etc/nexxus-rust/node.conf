# NeXXuS Rust-нода — единый конфиг (env > node.conf > дефолт)
# Секреты здесь не хранятся.

# WS API (JSON-RPC 2.0) — только loopback, доступ по токену
api=127.0.0.1:4010

# P2P-порт ноды
listen=0.0.0.0:4001

# Tor: 1 = публиковать onion v3 через Arti (встроенный Tor, без контейнера)
tor=1

# Пул хранилища: 16 ГБ (минимум по требованию владельца)
max_store_bytes=17179869184

# Лимиты полосы (кбит/с), 0 = без ограничения
max_up_kbps=0
max_down_kbps=0

# Порог отсечения (байт) и интервал PoR-аудита (сек)
threshold=0
por_audit_secs=21600

# Длительность эпохи (сек)
epoch_secs=300

# --- ADR-0011: авто-дискавери ---
# 1 = нода сама ищет соседей (LAN beacon + sweep + Tailscale + каталог-релей)
discovery=1

# UDP-broadcast beacon в LAN (порт обмена объявлениями)
beacon_port=4002
beacon_interval=15

# TCP-sweep локальной подсети: находит ноды, не публикующие наш beacon
# (в т.ч. ноды другой реализации — как сосед на 192.168.58.1)
lan_sweep=1
lan_sweep_interval=120

# Tailscale: брать адреса 100.64.0.0/10 из `tailscale status --json`
tailscale_discovery=1

# Каталог-релей: список известных адресов нод (POST /publish, GET /peers).
# Пусто = каталог выключен. На хосте-релее поднимается `nexxusd directory`.
directory_url=
directory_interval=60

# Как часто профилировать найденных пиров (доступность, RTT, скорость)
probe_interval=60

# Сколько самых быстрых пиров держим в рабочем наборе (6..12)
top_peers=8
