# ==============================================================================
# NeXXUs Sovereign P2P Storage Node Configuration
# Documentation: https://github.com/PerfectFriend/NeXXuS-Node-Hermes-Rust
#
# Размер пула — 16 ГБ (минимальная секция по 16 ГБ, дефолт раздела в коде),
# а не 384 ГБ из дефолта установщика: на хосте свободно ~46 ГБ.
# ==============================================================================

# Network settings
NEXXUS_HOST=0.0.0.0
NEXXUS_PORT=3999

# Storage allocation
NEXXUS_DATA_DIR=/var/lib/nexxus
NEXXUS_STORAGE_GB=16

# Erasure coding & security
NEXXUS_REED_SOLOMON_DATA=4
NEXXUS_REED_SOLOMON_PARITY=2
NEXXUS_CHUNK_SIZE_KB=16

# Peer mesh bootstrap
NEXXUS_BOOTSTRAP_PEERS=

# Logging
NEXXUS_LOG_LEVEL=info
