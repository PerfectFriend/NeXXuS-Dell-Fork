[Service]
# Arti (встроенный Tor) пишет свой кэш и onion-состояние на диск.
# С ProtectHome=read-only нужен явный writable-каталог внутри хранилища ноды.
Environment=ARTI_CACHE=/var/lib/nexxus-rust/arti
Environment=ARTI_STATE_DIR=/var/lib/nexxus-rust/arti
Environment=XDG_CACHE_HOME=/var/lib/nexxus-rust/cache
Environment=XDG_DATA_HOME=/var/lib/nexxus-rust/home
Environment=HOME=/var/lib/nexxus-rust/home
ReadWritePaths=/var/lib/nexxus-rust
